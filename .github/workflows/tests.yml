name: Game checks
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop-chromium
            os: ubuntu-latest
            workers: 2
          - project: mobile-chromium
            os: ubuntu-latest
            workers: 2
          # macOS WebKit most closely matches the Safari engine used on iPhones.
          - project: mobile-webkit
            os: macos-latest
            workers: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: python3 -m unittest discover -s test -p '*_test.py'
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --project="${{ matrix.project }}" --workers=${{ matrix.workers }}
      - name: Keep browser review evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-review-evidence-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
