name: Android test APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-latest
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: npm ci
      - name: Package the production-connected game
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SHELFLIFE_PUBLIC_URL: https://shelflife-game.vercel.app/
        run: python3 scripts/build_site.py --require-cloud
      - run: npx cap sync android
      - name: Preserve the test app signing identity
        env:
          DEBUG_KEYSTORE: ${{ secrets.SHELFLIFE_ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$DEBUG_KEYSTORE" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: shelf-life-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Update the test release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        run: |
          notes="Debug build for commit ${REVISION}. Download the APK on Android, allow installation from your browser when prompted, then open the file. This build is for testing and is not a Play Store release. If Android cannot update an existing edition, back up or link your shelf before switching. Do not uninstall to force an update."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --title 'Latest Android test build' --notes "$notes" --prerelease
          else
            gh release create android-latest --target "$REVISION" --title 'Latest Android test build' --notes "$notes" --prerelease
          fi
          gh release upload android-latest android/app/build/outputs/apk/debug/app-debug.apk --clobber
