name: Publish tester game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check game and desktop launcher
        run: |
          node --test test/*.test.mjs
          python3 -m unittest discover -s test -p '*_test.py'
      - name: Package playable files
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
  cleanup-merged-branches:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove integrated release branches
        uses: actions/github-script@v7
        with:
          script: |
            // Remove only this release branch after its exact head is in deployed main.
            const branches = [['polish/performance-and-play', null]];
            for (const [branch, expected] of branches) {
              const ref = 'heads/' + branch;
              let current;
              try { current = (await github.rest.git.getRef({ ...context.repo, ref })).data.object.sha; }
              catch (error) { if (error.status === 404) continue; throw error; }
              if (expected && !current.startsWith(expected)) {
                core.warning('Preserving changed branch: ' + branch); continue;
              }
              const comparison = (await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: current + '...' + context.sha, per_page: 1
              })).data;
              if (comparison.merge_base_commit.sha !== current || comparison.behind_by !== 0) {
                core.warning('Preserving unmerged work: ' + branch); continue;
              }
              const fresh = (await github.rest.git.getRef({ ...context.repo, ref })).data.object.sha;
              if (fresh !== current) { core.warning('Branch moved during check: ' + branch); continue; }
              await github.rest.git.deleteRef({ ...context.repo, ref });
              core.info('Deleted integrated branch: ' + branch);
            }
