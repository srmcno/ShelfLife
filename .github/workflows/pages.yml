name: Publish Shelf Life
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/tests.yml
  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Package playable files
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify the published game
        env:
          EXPECTED_REVISION: ${{ github.sha }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify_pages.mjs
      - name: Keep live browser evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: live-pages-evidence
          path: live-check-results/
          if-no-files-found: ignore
          retention-days: 7
