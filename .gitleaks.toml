title = "Shelf Life secret scan"

[extend]
useDefault = true

# The Supabase publishable key in src/cloud/config.js is public by design: it
# ships to every browser, and row level security protects the data. Only that
# exact key format is allowed, anywhere. A secret key (sb_secret_...) or a
# service_role JWT is still caught, and test/cloud_client.test.mjs fails if
# anything but a publishable or anon key is shipped in that file.
[allowlist]
description = "Public Supabase keys and a published RFC test vector"
regexes = [
  '''sb_publishable_[A-Za-z0-9_-]+''',
  # Public authentication secret from the RFC 8291 Appendix A test vector.
  '''BTBZMqHH6r4Tts7J_aSIgg'''
]
